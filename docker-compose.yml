services:
  full-code-review:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: python:3.11-slim-bookworm
    container_name: full-code-review
    restart: unless-stopped
    environment:
      REVIEW_CONFIG_PATH: /app/config/projects.json
      CODEX_HOME: /app/codex-home
      PYTHONPATH: /app/src
    volumes:
      - ./config/projects.example.json:/app/config/projects.json:ro
      - ./config/codex-config.toml.example:/app/codex-home/config.toml:ro
      - ./state:/app/state
      # Put reviewed repositories under ./review-repos, or change this path to your repo parent directory.
      - ./review-repos:/repos:ro
    # If the local LLM gateway runs on the Docker host, use host.docker.internal in config.toml.
    extra_hosts:
      - "host.docker.internal:host-gateway"
